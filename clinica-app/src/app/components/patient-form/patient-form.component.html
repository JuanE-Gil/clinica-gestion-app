<div class="max-w-2xl mx-auto mt-10 p-8 bg-white rounded-3xl shadow-2xl border border-gray-100">

  <div class="flex items-center gap-4 mb-8">
    <div class="bg-blue-600 p-3 rounded-2xl shadow-lg shadow-blue-100">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
      </svg>
    </div>
    <div>
      <h2 class="text-2xl font-black text-gray-800">Registrar Paciente</h2>
      <p class="text-xs text-gray-400 uppercase font-bold tracking-widest">SAID.SALUD - Admisión</p>
    </div>
  </div>

  @if (errorMessage()) {
    <div class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm font-bold rounded-r-xl">
      ⚠️ {{ errorMessage() }}
    </div>
  }

  <form [formGroup]="patientForm" (ngSubmit)="onSubmit()" class="space-y-5">

    <div>
      <label class="block text-xs font-black text-gray-400 uppercase mb-1">Nombre Completo</label>
      <input type="text" formControlName="full_name" placeholder="Ej. Juan Pérez Gonzales"
             class="w-full p-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-blue-500 transition-all">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-black text-gray-400 uppercase mb-1">DNI (8 dígitos)</label>
        <input type="text" formControlName="dni" maxlength="8" placeholder="00000000"
               class="w-full p-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-blue-500 transition-all">
      </div>
      <div>
        <label class="block text-xs font-black text-gray-400 uppercase mb-1">Celular</label>
        <input type="text" formControlName="phone" maxlength="9" placeholder="999888777"
               class="w-full p-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-blue-500 transition-all">
      </div>
    </div>

    <div>
      <label class="block text-xs font-black text-gray-400 uppercase mb-1">Dirección Domiciliaria</label>
      <textarea formControlName="address" rows="3" placeholder="Av. Los Incas 456, Int. 3, San Miguel"
                class="w-full p-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-blue-500 transition-all"></textarea>
    </div>

    <div class="flex gap-3 pt-6">
      <a routerLink="/patients"
         class="flex-1 text-center py-4 bg-gray-100 text-gray-500 rounded-2xl font-bold hover:bg-gray-200 transition-all">
        Cancelar
      </a>
      <button type="submit" [disabled]="patientForm.invalid || isSubmitting()"
              class="flex-2 py-4 bg-blue-600 text-white rounded-2xl font-black text-lg shadow-xl shadow-blue-100 hover:bg-blue-700 disabled:bg-gray-200 disabled:shadow-none transition-all">
        {{ isSubmitting() ? 'Guardando...' : 'Guardar Paciente' }}
      </button>
    </div>

  </form>
</div>
