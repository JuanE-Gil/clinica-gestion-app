<div class="max-w-4xl mx-auto p-8 bg-white rounded-3xl shadow-2xl border border-gray-100 mt-10">
  <div class="flex justify-between items-center mb-8 pb-4 border-b">
    <h2 class="text-2xl font-black text-gray-800 italic">Nueva Atención SAID.SALUD</h2>
    <div class="text-right">
      <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Total Estimado</p>
      <p class="text-2xl font-black text-blue-600">S/. {{ estimatedTotal() | number:'1.2-2' }}</p>
    </div>
  </div>

  <form [formGroup]="adminForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="text-xs font-bold text-gray-400 uppercase">Paciente</label>
        <select formControlName="patientId" class="w-full mt-1 p-3 bg-gray-50 rounded-xl border-none focus:ring-2 focus:ring-blue-500">
          <option value="">Seleccione...</option>
          @for (p of patients(); track p.id) { <option [value]="p.id">{{ p.full_name }}</option> }
        </select>
      </div>
      <div>
        <label class="text-xs font-bold text-gray-400 uppercase">Enfermera</label>
        <select formControlName="nurseId" class="w-full mt-1 p-3 bg-gray-50 rounded-xl border-none focus:ring-2 focus:ring-blue-500">
          <option value="">Seleccione...</option>
          @for (n of nurses(); track n.id) { <option [value]="n.id">{{ n.name }}</option> }
        </select>
      </div>
      <div>
        <label class="text-xs font-bold text-gray-400 uppercase">Tratamiento</label>
        <select formControlName="treatmentId" class="w-full mt-1 p-3 bg-gray-50 rounded-xl border-none focus:ring-2 focus:ring-blue-500">
          <option value="">Seleccione...</option>
          @for (t of treatments(); track t.id) { <option [value]="t.id">{{ t.name }}</option> }
        </select>
      </div>
    </div>

    <div class="mt-10">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-gray-700">Insumos Utilizados</h3>
        <button type="button" (click)="addItem()" class="text-sm font-bold text-blue-600">+ Añadir Insumo</button>
      </div>

      <div formArrayName="items" class="space-y-3">
        @for (item of items.controls; track $index; let i = $index) {
          <div [formGroupName]="i" class="flex gap-3 items-center bg-gray-50 p-3 rounded-xl">
            <div class="flex-1">
              <select formControlName="productId" class="w-full bg-white border-none rounded-lg">
                <option value="">Insumo...</option>
                @for (prod of products(); track prod.id) {
                  <option [value]="prod.id">{{ prod.name }} ({{ prod.amount }})</option>
                }
              </select>
            </div>
            <input type="number" formControlName="quantity" class="w-20 bg-white border-none rounded-lg text-center">
            <button type="button" (click)="removeItem(i)" class="text-red-400 hover:text-red-600">✕</button>
          </div>
        }
      </div>
    </div>

    <button type="submit" [disabled]="adminForm.invalid" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-lg shadow-xl shadow-blue-100 transition-all active:scale-95">
      PROCESAR ATENCIÓN
    </button>
  </form>
</div>
