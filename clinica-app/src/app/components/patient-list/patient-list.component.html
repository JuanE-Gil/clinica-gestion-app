<div class="p-6 max-w-7xl mx-auto">
  <div class="flex justify-between items-center mb-10">
    <div>
      <h2 class="text-3xl font-black text-gray-900">Directorio de Pacientes</h2>
    </div>

    <a
      routerLink="/patients/new"
      class="bg-blue-600 text-white px-6 py-3.5 rounded-2xl font-black text-sm shadow-xl shadow-blue-100 hover:bg-blue-700 hover:scale-105 transition-all flex items-center gap-2"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        viewBox="0 0 20 20"
        fill="currentColor"
      >
        <path
          fill-rule="evenodd"
          d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
          clip-rule="evenodd"
        />
      </svg>
      Nuevo Paciente
    </a>
  </div>

  <div class="mb-8">
    <div class="relative max-w-md">
      <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400"> 🔍 </span>
      <input
      type="text"
      (input)="updateSearch($event)"
      placeholder="Buscar por nombre o DNI..."
      class="w-full pl-12 pr-4 py-4 bg-white border border-gray-100 rounded-2xl shadow-sm focus:ring-2 focus:ring-blue-500 transition-all outline-none"
      />
    </div>
    <p>En Proceso</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    @for (p of allPatients(); track p.id) {
      <div
        class="bg-white border border-gray-100 rounded-3xl p-6 shadow-sm hover:shadow-xl hover:border-blue-100 transition-all group"
      >
        <div class="flex items-center gap-4 mb-6">
          <div
            class="h-14 w-14 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-600 font-black text-xl group-hover:bg-blue-600 group-hover:text-white transition-colors"
          >
            {{ p.full_name.charAt(0) }}
          </div>
          <div>
            <h3 class="font-bold text-gray-900 text-lg leading-tight">{{ p.full_name }}</h3>
            <p class="text-xs font-bold text-gray-400">DNI: {{ p.dni }}</p>
          </div>
        </div>

        <div class="space-y-3 mb-6">
          <div class="flex items-start gap-2 text-sm text-gray-500">
            <span class="text-blue-400 mt-1">📍</span>
            <p class="line-clamp-2 italic">{{ p.address }}</p>
          </div>
          <div class="flex items-center gap-2 text-sm text-gray-500">
            <span class="text-blue-400">📞</span>
            <p>{{ p.phone }}</p>
          </div>
        </div>

        <a
          [routerLink]="['/patients', p.id]"
          class="block text-center w-full py-3 bg-gray-50 text-blue-600 rounded-xl font-black text-sm hover:bg-blue-600 hover:text-white transition-all shadow-sm"
        >
          Ver Ficha Clínica
        </a>
      </div>
    } @empty {
      <div class="col-span-full py-20 text-center">
        <div class="bg-gray-50 inline-block p-6 rounded-full mb-4">☁️</div>
        <p class="text-gray-400 font-bold">No hay pacientes registrados aún.</p>
      </div>
    }
  </div>
</div>
